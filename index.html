<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Periyodik Tablo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>⚛ PERİYODİK TABLO</h1>

<input type="text" id="searchInput" placeholder="Element ara...">

<div class="filters">
    <button onclick="filterElements('all')">Tümü</button>
    <button onclick="filterElements('Metal')">Metal</button>
    <button onclick="filterElements('Ametal')">Ametal</button>
    <button onclick="filterElements('YarıMetal')">YarıMetal</button>
    <button onclick="filterElements('Soygaz')">Soygaz</button>
</div>

<div id="periodicTable"></div>

<!-- PERİYODİK EĞİLİMLER -->
<div class="trend-panel">
    <h2>📊 Periyodik Eğilimler</h2>

    <div class="trend-grid">
        <div class="trend-box">
            <h3>➡️ Sağa Doğru</h3>
            <p>Atom yarıçapı ⬇️</p>
            <p>İyonlaşma enerjisi ⬆️</p>
            <p>Elektronegatiflik ⬆️</p>
            <p>Metalik özellik ⬇️</p>
        </div>

        <div class="trend-box">
            <h3>⬇️ Aşağı Doğru</h3>
            <p>Atom yarıçapı ⬆️</p>
            <p>İyonlaşma enerjisi ⬇️</p>
            <p>Elektronegatiflik ⬇️</p>
            <p>Metalik özellik ⬆️</p>
        </div>
    </div>
</div>

<!-- MODAL -->
<div id="modal">
    <div class="modal-content">
        <span onclick="closeModal()">X</span>
        <h2 id="modalName"></h2>
        <img id="modalImage">
        <div id="modalDetails"></div>
    </div>
</div>

<script src="script.js"></script>

</body>
</html>
